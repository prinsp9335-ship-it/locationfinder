<!DOCTYPE html>
<html>
<head>
<title>Outlet Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{font-family:Arial;margin:20px}
.container{display:flex;gap:40px;align-items:flex-start}
.box{flex:1}
input{padding:8px;width:80%;margin-bottom:10px}
button{padding:8px 15px;cursor:pointer;margin-top:5px}
ul{list-style:none;padding:0}
li{margin-bottom:15px;padding:12px;border:1px solid #ccc;border-radius:6px}
.name{font-weight:bold}
.address{font-size:14px;color:#555}
.distance{margin:6px 0}
#map{height:400px;margin-top:20px}
#mapBtn,#routeBtn{display:none}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h2>Find Outlets</h2>

<input type="text" id="ids" placeholder="Enter Outlet IDs">
<button onclick="findOutlets()">Find</button>

<button id="mapBtn" onclick="showAllOnMap()">Show Map</button>
<button id="routeBtn" onclick="openFullRoute()">Full Route</button>

<ul id="result"></ul>
<div id="map"></div>

</div>

</div>

<script>

const SHEET_ID="1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";
let outletsData=[],map;

function initMap(lat,lon){
map=L.map('map').setView([lat,lon],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([lat,lon]).addTo(map).bindPopup("You are here");
}

function showAllOnMap(){
navigator.geolocation.getCurrentPosition(pos=>{
if(!map)initMap(pos.coords.latitude,pos.coords.longitude);
drawMarkers();
});
}

function drawMarkers(){
outletsData.forEach(o=>{
if(o.Latitude&&o.Longitude){
L.marker([o.Latitude,o.Longitude])
.addTo(map)
.bindTooltip(o.name,{permanent:true,direction:"top"})
.on('click',()=>{
window.open(`https://www.google.com/maps?q=${o.Latitude},${o.Longitude}`,"_blank");
});
}
});
}

function openFullRoute(){
navigator.geolocation.getCurrentPosition(pos=>{
let points=[`${pos.coords.latitude},${pos.coords.longitude}`];
outletsData.forEach(o=>points.push(`${o.Latitude},${o.Longitude}`));
window.open("https://www.google.com/maps/dir/"+points.join("/"),"_blank");
});
}

function getDistance(lat1,lon1,lat2,lon2){
const R=6371;
const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;
const a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function findOutlets(){

const ids=document.getElementById("ids").value
.split(/[\s,]+/)
.filter(x=>x);

const res=await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
const data=await res.json();

const filtered=data.filter(d=>ids.includes(String(d["Outlet Id"])));

navigator.geolocation.getCurrentPosition(pos=>{

let prevLat=pos.coords.latitude;
let prevLon=pos.coords.longitude;

outletsData=[];

const ul=document.getElementById("result");
ul.innerHTML="";

filtered.forEach(o=>{

let lat=parseFloat(o.Latitude);
let lon=parseFloat(o.Longitude);

let dist=getDistance(prevLat,prevLon,lat,lon);

let obj={
name:o["Outlet Name"],
address:o["Address"],
Latitude:lat,
Longitude:lon,
distance:dist,
link:o["Location"]
};

outletsData.push(obj);

prevLat=lat;
prevLon=lon;

let li=document.createElement("li");

li.innerHTML=`
<div class="name">${obj.name}</div>
<div class="address">${obj.address||"NA"}</div>
<div class="distance">${obj.distance.toFixed(2)} km</div>
<a href="${obj.link}" target="_blank">Open</a>
`;

ul.appendChild(li);

});

document.getElementById("mapBtn").style.display="inline-block";
document.getElementById("routeBtn").style.display="inline-block";

});
}

</script>

</body>
</html>
